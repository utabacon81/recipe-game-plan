<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Game Plan</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1E1C1A">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Plan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E1C1A; --panel:#272421; --line:#3A3632; --text:#F4EFE8; --muted:#BDB4A9;
    --accent:#F08A3C; --done:#7FB5A8; --warn:#E06C5A; --all:#9DB4D6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto}
  .brand{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:3px;text-transform:uppercase;font-size:14px;color:var(--accent)}
  .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .chip-btn{background:none;border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font:500 14px Inter,sans-serif;min-height:40px;cursor:pointer}
  .chip-btn:hover{border-color:var(--muted)}
  .chip-btn.set{border-color:var(--accent);color:var(--accent)}
  @media (max-width:420px){ .chip-btn{padding:8px 10px;font-size:13px} .brand{font-size:12px;letter-spacing:2px} }
  .timeline{display:flex;gap:6px;overflow-x:auto;max-width:720px;margin:10px auto 0;padding-bottom:4px;scrollbar-width:none}
  .timeline::-webkit-scrollbar{display:none}
  .tl{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 10px;font:600 14px Oswald,sans-serif;letter-spacing:.5px;min-height:40px;cursor:pointer}
  .tl.cur{background:var(--accent);border-color:var(--accent);color:#1E1C1A}
  .tl.complete:not(.cur){color:var(--done);border-color:#3f5a53}
  main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:20px 16px 120px}
  .when{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .time{font-family:Oswald,sans-serif;font-weight:700;font-size:56px;line-height:1;color:var(--accent)}
  .count{color:var(--muted);font-size:15px}
  .headline{margin:8px 0 4px;font-size:20px;font-weight:600;line-height:1.35}
  .progress{height:6px;background:var(--line);border-radius:3px;margin:16px 0 20px;overflow:hidden}
  .progress>div{height:100%;background:var(--done);transition:width .2s}
  .group{margin-top:22px}
  .tag{display:inline-flex;align-items:center;gap:8px;font:600 13px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  .tag i{width:10px;height:10px;border-radius:5px;display:inline-block}
  .ings{background:#2c2723;border:1px solid var(--line);border-left:4px solid var(--c,#888);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .ings h4{margin:0 0 6px;font:600 12px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .ings ul{margin:0;padding:0;list-style:none}
  .ings li{padding:5px 0;font-size:16px;line-height:1.35;border-top:1px solid #36312c}
  .ings li:first-child{border-top:none}
  .ings li.again{color:var(--muted)}
  .badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font:600 11px Inter,sans-serif;letter-spacing:.5px;text-transform:uppercase;vertical-align:2px}
  .badge.p{background:#3f5a53;color:#CFE7E0}
  .badge.a{background:#3A3632;color:var(--muted)}
  .task{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
  .task input{appearance:none;-webkit-appearance:none;flex:0 0 28px;width:28px;height:28px;margin:0;border:2px solid var(--muted);border-radius:7px;display:grid;place-content:center;cursor:pointer;background:transparent}
  .task input:checked{background:var(--done);border-color:var(--done)}
  .task input:checked::after{content:"";width:12px;height:7px;border-left:3px solid #1E1C1A;border-bottom:3px solid #1E1C1A;transform:translateY(-2px) rotate(-45deg)}
  .task input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .task .t{font-size:17px;font-weight:600;line-height:1.35}
  .task .d{font-size:15px;color:var(--muted);line-height:1.45;margin-top:4px}
  .task.checked .t,.task.checked .d{opacity:.45;text-decoration:line-through;text-decoration-thickness:1px}
  .note{margin-top:22px;border:1px dashed #5a4a3c;border-radius:12px;padding:12px 14px;color:#E9CDB4;font-size:15px;line-height:1.45}
  .note b{color:var(--accent)}
  .status{margin-top:16px;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45;background:var(--panel);border:1px solid var(--line)}
  .status b{color:var(--accent)}
  .status.late b{color:var(--warn)}
  .status.ok b{color:var(--done)}
  .big{width:100%;min-height:56px;border-radius:14px;border:1px solid var(--accent);background:none;color:var(--accent);font:600 18px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:16px}
  .big.solid{background:var(--accent);color:#1E1C1A}
  .big:disabled{opacity:.35;cursor:default}
  nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 16px calc(16px + env(safe-area-inset-bottom))}
  .navin{display:flex;gap:10px;max-width:720px;margin:0 auto}
  .nb{flex:1;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 18px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
  .nb.next{flex:2;background:var(--accent);border-color:var(--accent);color:#1E1C1A}
  .nb:disabled{opacity:.35;cursor:default}
  /* setup */
  h2{font:600 15px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
  h2:first-child{margin-top:4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .field{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:500 16px Inter,sans-serif;padding:12px 14px}
  textarea.field{min-height:180px;resize:vertical;line-height:1.45}
  .row{display:flex;gap:10px}
  .row .field{flex:1}
  .btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--text);font:600 16px Inter,sans-serif;padding:0 16px;cursor:pointer}
  .btn.go{background:var(--accent);border-color:var(--accent);color:#1E1C1A}
  .btn.sm{min-height:40px;font-size:14px;padding:0 12px}
  .btn.del{color:#F0A99D;border-color:#5a3a35}
  .linkbtn{background:none;border:none;color:var(--accent);font:500 15px Inter,sans-serif;padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .msg{margin-top:10px;font-size:15px;line-height:1.45}
  .msg.err{color:#F0A99D}
  .msg.ok{color:var(--done)}
  .rc{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:14px;margin-bottom:10px}
  .rc .nm{font-size:18px;font-weight:600;line-height:1.3}
  .rc .meta{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.4;word-break:break-word}
  .rc .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .rv{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .rv .st{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #332f2b}
  .rv .st:last-child{border-bottom:none}
  .rv .st .tx{flex:1;font-size:14px;line-height:1.45;color:var(--text)}
  .rv .st .tx b{color:var(--muted);font-weight:600}
  .rv .st input{width:76px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 16px Inter,sans-serif;text-align:center}
  .rv .st input.edited{border-color:var(--accent);color:var(--accent)}
  .rv .st .u{font-size:12px;color:var(--muted);text-align:center;margin-top:3px}
  .empty{color:var(--muted);font-size:15px;line-height:1.5;padding:4px 0}
  .readyrow{display:flex;gap:10px;align-items:center}
  .readyrow input{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 17px Inter,sans-serif;padding:0 12px;color-scheme:dark;min-width:0}
  .hint{color:var(--muted);font-size:14px;line-height:1.45;margin-top:8px}
  .batch{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .batch button{min-width:52px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font:600 15px Oswald,sans-serif;letter-spacing:.5px;cursor:pointer;padding:0 10px}
  .batch button.on{background:var(--accent);border-color:var(--accent);color:#1E1C1A}
  .bx{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .bxm{flex:1;min-width:0}
  .bxn{font-size:16px;font-weight:600;line-height:1.3}
  .bx .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .inmeal{font-size:13px;color:var(--done);font-weight:600;padding:0 6px}
  .ilist .top2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ilist .title{font:700 34px Oswald,sans-serif;color:var(--accent);line-height:1.1}
  .ilist .meta{color:var(--muted);font-size:15px}
  .ilist h2{margin:26px 0 0}
  .ilist .batch{margin:10px 0}
  .irow{display:flex;gap:12px;align-items:center;padding:9px 0;cursor:pointer}
  .irow input{appearance:none;-webkit-appearance:none;flex:0 0 24px;width:24px;height:24px;margin:0;border:2px solid var(--muted);border-radius:6px;display:grid;place-content:center;cursor:pointer}
  .irow input:checked{background:var(--done);border-color:var(--done)}
  .irow input:checked::after{content:"";width:10px;height:6px;border-left:3px solid #1E1C1A;border-bottom:3px solid #1E1C1A;transform:translateY(-2px) rotate(-45deg)}
  .irow .nm{flex:1;font-size:16px;line-height:1.35}
  .irow.have .nm{opacity:.45;text-decoration:line-through}
  .qrow{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:15px}
  .qrow input{width:22px;height:22px;accent-color:var(--accent)}
  .qtimes{align-items:center;margin-top:8px}
  .qtimes input{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 17px Inter,sans-serif;padding:0 12px;color-scheme:dark}
  .qtimes span{color:var(--muted)}
  .qbrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
  .sel{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:500 15px Inter,sans-serif;padding:0 10px;width:100%;color-scheme:dark}
  .cf{padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
  .cf:first-child{border-top:none;padding-top:0}
  .tlday{flex:0 0 auto;align-self:center;font:600 12px Oswald,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--done);padding:0 4px 0 10px;border-left:2px solid var(--line);margin-left:4px;white-space:nowrap}
  .tlday:first-child{border-left:none;margin-left:0;padding-left:0}
  .rb{margin-top:12px}
  .rb .readyrow input{font-size:15px}
  .rb .when2{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.45}
  .warnline{color:#F0A99D;font-size:14px;margin-top:8px;line-height:1.45}
  .dayh{font:600 14px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--done);margin-bottom:6px}
  #banner{position:fixed;left:12px;right:12px;top:12px;z-index:20;display:none}
  #banner .bn{max-width:696px;margin:0 auto;background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:14px;font-size:15px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #banner b{color:var(--accent)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .modal.open{display:flex}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%}
  .box p{margin:0 0 16px;line-height:1.45}
  .box .row button{flex:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Game Plan</div>
    <div class="tools" id="tools"></div>
  </div>
  <div class="timeline" id="timeline" role="tablist" aria-label="Time blocks"></div>
</header>

<main id="main" aria-live="polite"></main>

<nav id="nav">
  <div class="navin">
    <button class="nb" id="prev" type="button">Prev</button>
    <button class="nb next" id="next" type="button">Next</button>
  </div>
</nav>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtext">
  <div class="box">
    <p id="mtext"></p>
    <div class="row">
      <button type="button" class="btn" id="mCancel">Cancel</button>
      <button type="button" class="btn go" id="mOk">OK</button>
    </div>
  </div>
</div>

<script src="core.js"></script>
<script>
/* ============================================================
   Storage
   ============================================================ */
let S = { view:"setup", recipes:[], library:[], target:null, startAt:null, idx:0, done:{}, open:{}, have:{} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.recipes)) S = Object.assign(S, s); } catch(e) {}
if (!Array.isArray(S.library)) S.library = [];
if (!S.have) S.have = {};
if (!S.quiet) S.quiet = { on:true, from:"22:00", to:"10:00" };
if (!S.approved) S.approved = {};
S.recipes.forEach(r=>{ if (!r.k) r.k = 1; if (!S.library.some(x=>x.id===r.id)) S.library.push(libCopy(r)); });
const BATCHES = [0.5, 1, 1.5, 2, 3];

/* The recipe box keeps a master copy of every recipe. The meal holds working copies with a batch size. */
function libCopy(r){ const c = JSON.parse(JSON.stringify(r)); delete c.k; delete c.color; delete c.readyBy; c.saved = c.saved || Date.now(); return c; }
function syncLib(r){
  const i = S.library.findIndex(x=>x.id===r.id);
  const c = libCopy(r); c.used = Date.now();
  if (i >= 0) { c.saved = S.library[i].saved; S.library[i] = c; } else S.library.unshift(c);
}
function addToMeal(lib, k){
  if (S.recipes.some(x=>x.id===lib.id)) return false;
  const used = new Set(S.recipes.map(x=>x.color));
  const r = JSON.parse(JSON.stringify(lib));
  r.k = k || 1;
  r.color = COLORS.find(c=>!used.has(c)) || COLORS[S.recipes.length % COLORS.length];
  S.recipes.push(r); syncLib(r);
  return true;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} queuePush(); queueAlerts(); }


/* ---------- batch scaling ---------- */
const FRACS = [[0,""],[1/8,"1/8"],[1/4,"1/4"],[1/3,"1/3"],[3/8,"3/8"],[1/2,"1/2"],[5/8,"5/8"],[2/3,"2/3"],[3/4,"3/4"],[7/8,"7/8"],[1,""]];
function qtyStr(v){
  if (v >= 10) return String(Math.round(v));
  let w = Math.floor(v), f = v - w, best = FRACS[0];
  FRACS.forEach(x=>{ if (Math.abs(x[0]-f) < Math.abs(best[0]-f)) best = x; });
  if (best[0] === 1) { w += 1; best = FRACS[0]; }
  if (!w && !best[1]) return String(+v.toFixed(2));
  return w ? (best[1] ? w + " " + best[1] : String(w)) : best[1];
}
const NUM = "(\\d+\\s+\\d+\\s*\\/\\s*\\d+|\\d+\\s*\\/\\s*\\d+|\\d*\\.\\d+|\\d+\\s?[½⅓⅔¼¾⅛⅜⅝⅞]|[½⅓⅔¼¾⅛⅜⅝⅞]|\\d+)";
function numVal(t){ return +normNum(t).split(" ").reduce((a,x)=>a + +x, 0); }
/* Convert up when a scaled spoon measure gets big. */
function upUnit(v, unit){
  const u = unit.toLowerCase();
  if (/^(tsp|teaspoons?)$/.test(u) && v >= 3 && Math.abs(v/3*4 - Math.round(v/3*4)) < .05) return upUnit(v/3, "tbsp");
  if (/^(tbsp|tablespoons?)$/.test(u) && v >= 4 && Math.abs(v/4 - Math.round(v/4*4)/4) < .01) return [v/16, v/16 > 1 ? "cups" : "cup"];
  return [v, unit];
}
const LEAD_QTY = new RegExp("^(about\\s+|approximately\\s+)?" + NUM + "(\\s*(?:-|–|to)\\s*" + NUM + ")?(\\s+)([a-zA-Z.]+)?", "i");
const PLURAL = { cup:"cups", tablespoon:"tablespoons", teaspoon:"teaspoons", pound:"pounds", ounce:"ounces", clove:"cloves", can:"cans", stick:"sticks", quart:"quarts", pint:"pints", liter:"liters", gram:"grams" };
function unitFor(unit, v){
  if (!unit) return unit;
  const low = unit.toLowerCase();
  const sing = Object.keys(PLURAL).find(k=>k===low || PLURAL[k]===low);
  if (!sing) return unit;
  const out = v > 1.001 ? PLURAL[sing] : sing;
  return unit[0] === unit[0].toUpperCase() ? out[0].toUpperCase() + out.slice(1) : out;
}
function scaleLine(raw, k){
  if (k === 1) return raw;
  const m = raw.match(LEAD_QTY);
  if (!m) return raw;
  const lo = numVal(m[2]) * k, hi = m[4] ? numVal(m[4]) * k : null;
  let unit = m[6] || "", rest = raw.slice(m[0].length);
  let [v, u] = upUnit(lo, unit);
  let out = qtyStr(v);
  if (hi != null) { const [v2] = upUnit(hi, unit); out += " to " + qtyStr(v2); }
  if (unit && u !== unit) unit = u;
  unit = unitFor(unit, hi != null ? Math.max(v, upUnit(hi, unit)[0]) : v);
  return (m[1] || "") + out + (m[5] || " ") + unit + rest;
}
const TEXT_QTY = new RegExp("\\b" + NUM + "(\\s*(?:-|to)\\s*" + NUM + ")?\\s+(cups?|tablespoons?|tbsp|teaspoons?|tsp|ounces?|oz|pounds?|lbs?|grams?|g|kilograms?|kg|ml|milliliters?|liters?|quarts?|pints?|cloves?|cans?|sticks?)\\b(?!\\s*°)", "gi");
function scaleText(t, k){
  if (k === 1) return t;
  return t.replace(TEXT_QTY, (all, a, range, b, unit)=>{
    let out = qtyStr(numVal(a)*k);
    if (range) out += " to " + qtyStr(numVal(b)*k);
    return out + " " + unitFor(unit, numVal(range ? b : a)*k);
  });
}
function servings(r){
  const m = String(r.yld||"").match(/(\d+)(?:\s*(?:-|to)\s*(\d+))?/);
  if (!m) return "";
  const k = r.k || 1, a = Math.round(+m[1]*k), b = m[2] ? Math.round(+m[2]*k) : null;
  return "Serves " + a + (b ? " to " + b : "");
}
/* Bigger batches: hands-on work and prep take longer, timed waits (simmer, bake) don't. */
function activeFactor(k){ return 1 + 0.5*Math.max(0, k-1); }

/* ---------- per-recipe timeline ---------- */
function autoStepMin(r, i){ const k = r.k || 1; return Math.round(r.steps[i].sents.reduce((a,s)=>a + (s.timed ? s.m : s.m*activeFactor(k)), 0)); }
function stepMin(r, i){ const o = r.over[i]; return (o!=null && o!=="") ? +o : autoStepMin(r, i); }
/* ---------- quiet hours ----------
   S.quiet holds the off-hours (default 10pm to 10am); the app shows it as active hours.
   Hands-on steps outside active hours get flagged for an OK. Waits can run any time, but a flexible
   wait (soak, brine, chill, overnight) that would start in off-hours starts the evening before. */
const WAITV = /\b(simmer|bake|roast|rest|soak|chill|refrigerat|marinat|brais|steep|rise|rising|proof|thaw|cool|smoke|sous vide|reduce|boil|poach|cure|curing|brine|freez|stand|slow cook|pressure cook|reheat|warm|dry|bath|oven|let (it|them) (sit|set))\w*/i;
const FLEX = /\b(brin(?:e|ed|es|ing)|marinat\w*|soak\w*|refrigerat\w*|chill\w*|overnight|cure[ds]?|curing|dry[- ]brin\w*|cold[- ]ferment\w*)\b/i;
function hm(s){ const [h,m] = String(s||"0:00").split(":").map(Number); return (h||0)*60 + (m||0); }
/* Weekly quiet times: S.quiet.blocks = [{ days:"all"|"wkd"|"wke"|"0".."6", from, to, short }].
   short = longest hands-on task (minutes) that's still fine inside the block, like a lunch-break job. 0 = none. */
const QDAYS = [["all","Every day"],["wkd","Weekdays"],["wke","Weekends"],["0","Sunday"],["1","Monday"],["2","Tuesday"],["3","Wednesday"],["4","Thursday"],["5","Friday"],["6","Saturday"]];
function dayHit(key, dow){ return key === "all" || (key === "wkd" && dow >= 1 && dow <= 5) || (key === "wke" && (dow === 0 || dow === 6)) || key === String(dow); }
function inBlock(bk, ms){
  const d = new Date(ms), t = d.getHours()*60 + d.getMinutes(), a = hm(bk.from), b = hm(bk.to), dow = d.getDay();
  if (a === b) return false;
  if (a < b) return dayHit(bk.days, dow) && t >= a && t < b;
  /* Runs past midnight: belongs to the day it starts. */
  return (dayHit(bk.days, dow) && t >= a) || (dayHit(bk.days, (dow + 6) % 7) && t < b);
}
function quietAt(ms, len){
  const q = S.quiet; if (!q) return false;
  if (q.on) {
    const d = new Date(ms), t = d.getHours()*60 + d.getMinutes(), a = hm(q.from), b = hm(q.to);
    if (a !== b && (a < b ? (t >= a && t < b) : (t >= a || t < b))) return true;
  }
  return (q.blocks || []).some(bk=>inBlock(bk, ms) && !(bk.short && (len || 0) <= bk.short));
}
/* How long a flexible wait may run: up to 2x, or up to a day for anything marked overnight. */
function flexCap(text, dur){ return /overnight/i.test(text) ? Math.max(dur*2, 1440) : dur*2; }
function dayKey(ms){ const d = new Date(ms); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
/* Times are minutes relative to the eat time (0). */
function makeCtx(T){
  const ctx = { T, conflicts:[], notes:[] };
  ctx.Q = (x, len) => !!T && quietAt(T + x*60000, len);
  /* Only hands-on time has to fall inside active hours. Soaks, simmers and other waits can run any time. */
  /* hands: true for the whole span, a number for that many hands-on minutes from the start, or 0 for none. */
  ctx.ok = (b, e, hands)=>{ if (!hands) return true; const end = hands === true ? Math.max(e, b+1) : b + Math.max(1, hands); for (let x = b; x < end; x += 5) if (ctx.Q(x, end - b)) return false; return true; };
  ctx.search = (from, limit, test)=>{ for (let x = Math.floor(from/5)*5; x >= limit; x -= 5) if (test(x)) return x; return null; };
  return ctx;
}
function short(t, n){ t = String(t); n = n || 60; return t.length > n ? t.slice(0, n).replace(/\s+\S*$/,"").replace(/[,;:]$/,"") : t; }

/* Advance work hidden in an ingredient line, like "brined overnight" or "marinated 4 hours". */
function advItems(r){ return r.ings.map(parseIng).map((p,i)=>({...p, i})).filter(p=>p.prep && durMin(p.prep) > 0); }
function autoAdvMin(p){ return durMin(p.prep); }
function advMin(r, p){ const o = r.advOver && r.advOver[p.i]; return (o!=null && o!=="") ? +o : autoAdvMin(p); }
function prepItems(r){ return r.ings.map(parseIng).map((p,i)=>({...p, i})).filter(p=>p.prep && !durMin(p.prep)); }
function autoPrepMin(r){ const n = prepItems(r).length; return n ? Math.round(Math.max(5, n*3) * (1 + 0.6*Math.max(0, (r.k||1)-1))) : 0; }
function prepMin(r){ if (r.prepOver!=null && r.prepOver!=="") return +r.prepOver; return autoPrepMin(r); }

function matchIngredients(r){
  const parsed = r.ings.map(parseIng);
  const texts = r.steps.map(st=>st.sents.filter(s=>!s.pre).map(s=>s.t).join(" "));
  const hits = parsed.map(()=>[]);
  parsed.forEach((p,ii)=>{
    const words = p.name.split(/[^a-zñéèü'-]+/i).map(w=>w.toLowerCase()).filter(w=>w.length>=3 && !STOP.has(w));
    const head = words[words.length-1];
    const core = words.join(" ");
    const tiers = [];
    if (core && core.includes(" ")) tiers.push(t=>phraseRe(core).test(t));
    if (p.name && p.name !== core && p.name.split(" ").length>1) tiers.push(t=>phraseRe(p.name).test(t));
    if (head && !GENERIC.has(head)) tiers.push(t=>wordRe(head).test(t));
    const isGarnish = /\b(for garnish|for serving|to serve|toppings?)\b/i.test(p.raw);
    tiers.push(t=>CATS.some(([cue, member])=>cue.test(t) && (member.source==="." ? isGarnish : member.test(p.name))));
    const others = words.filter(w=>w!==head && !GENERIC.has(w));
    if (others.length) tiers.push(t=>others.some(w=>wordRe(w).test(t)));
    if (head && GENERIC.has(head)) tiers.push(t=>wordRe(head).test(t));
    for (const tier of tiers) {
      const found = texts.map((t,si)=>tier(t)?si:-1).filter(x=>x>=0);
      if (found.length) { hits[ii] = found; break; }
    }
  });
  const remainingStep = texts.findIndex(t=>/\b(remaining ingredients|everything else|all (of )?the (remaining )?ingredients|rest of the ingredients)\b/i.test(t));
  parsed.forEach((p,ii)=>{ if (!hits[ii].length) hits[ii] = [remainingStep>=0 ? remainingStep : 0]; });
  return { parsed, hits };
}

/* Schedule one recipe backward from the eat time. */
function recipeSchedule(r, ctx){
  const k = r.k || 1;
  const { parsed, hits } = matchIngredients(r);
  const lastReal = r.steps.map((st,si)=>st.sents.some(s=>!s.pre)?si:-1).filter(x=>x>=0).pop();
  const steps = [];
  r.steps.forEach((st,si)=>{
    const real = st.sents.filter(s=>!s.pre);
    if (!real.length) return;
    let dur = stepMin(r, si), serve = false;
    const text = real.map(s=>s.t).join(" ");
    /* A short closing "serve with..." step lands right at the ready time. */
    if (si === lastReal && /\bserve\b/i.test(text) && !real.some(s=>s.timed) && r.over[si]==null) { dur = 0; serve = true; }
    const timed = real.filter(s=>s.timed).reduce((a,s)=>a+s.m,0), act = real.filter(s=>!s.timed).reduce((a,s)=>a+s.m,0);
    const wait = timed > 0 && timed >= act;
    /* For active hours: a timed sentence counts as a wait only if it's waiting work (simmer, bake, soak, chill and so on). */
    let wMin = 0, hMin = 0;
    real.forEach(x=>{ if (x.timed && WAITV.test(x.t)) wMin += x.m; else hMin += x.m; });
    if (wMin + hMin > 0 && dur !== wMin + hMin) hMin = Math.round(hMin * dur / (wMin + hMin));
    steps.push({ si, dur, serve, real, text, hands: dur > 0 && hMin > 0 ? Math.min(dur, hMin) : 0, flex: wait && dur >= 60 && FLEX.test(text), note:"" });
  });
  /* Place steps from the last one back. */
  let cursor = 0;
  for (let j = steps.length-1; j >= 0; j--) {
    const s = steps[j], nx = steps[j+1];
    let e = cursor, b = e - s.dur;
    const key = r.id + ":" + s.si;
    if (!ctx.ok(b, e, s.hands) && !S.approved[key]) {
      let fixed = false;
      if (s.flex) {
        const nb = ctx.search(b-5, e - flexCap(s.text, s.dur), x=>ctx.ok(x, e, false));
        if (nb != null) { s.note = "Stretched from " + fmtDur(s.dur) + " to " + fmtDur(e-nb) + " to keep hands-on work in your available hours."; ctx.notes.push({ x:nb, name:r.name, text:short(s.text) + " " + s.note.charAt(0).toLowerCase() + s.note.slice(1) }); b = nb; fixed = true; }
      }
      if (!fixed && nx && nx.flex) {
        const ne = ctx.search(e-5, nx.e - flexCap(nx.text, nx.dur), x=>ctx.ok(x - s.dur, x, s.hands) && !ctx.Q(x));
        if (ne != null) {
          nx.b = ne; nx.note = "Stretched to " + fmtDur(nx.e - ne) + " so the step before it stays in your available hours.";
          ctx.notes.push({ x:ne, name:r.name, text:short(nx.text) + " " + nx.note.charAt(0).toLowerCase() + nx.note.slice(1) });
          e = ne; b = e - s.dur; fixed = true;
        }
      }
      if (!fixed) ctx.conflicts.push({ key, x:b, name:r.name, text:s.text });
    }
    /* A flexible wait (soak, thaw overnight, brine) that would start outside active hours starts the evening before instead. Never flagged. */
    if (!s.hands && s.flex && ctx.Q(b)) {
      const nb = ctx.search(b-5, e - flexCap(s.text, s.dur), x=>!ctx.Q(x));
      if (nb != null) { s.note = "Starts early so it begins in your available hours. Runs " + fmtDur(e-nb) + "."; ctx.notes.push({ name:r.name, text:short(s.text).replace(/[.!]$/,"") + " now runs " + fmtDur(e-nb) + " so it starts in your available hours." }); b = nb; }
    }
    s.b = b; s.e = e; cursor = b;
  }
  const blocks = [];
  const firstSeen = {};
  let servedInSteps = false;
  steps.forEach(s=>{
    if (s.serve) servedInSteps = true;
    const ings = [];
    parsed.forEach((p,ii)=>{
      if (!hits[ii].includes(s.si)) return;
      const again = firstSeen[ii] !== undefined;
      if (!again) firstSeen[ii] = s.si;
      ings.push({ raw: again ? p.name : scaleLine(p.raw, k), prepped: !again && !!p.prep, again });
    });
    const tasks = s.real.map((x,ti)=>[r.id+":"+s.si+":"+ti, scaleText(x.t, k), [x.timed ? "About "+fmtDur(x.m) : "", batchNote(x.t, k)].filter(Boolean).join(" ")]);
    if (s.note && tasks.length) { const t = tasks[tasks.length-1]; t[2] = [t[2] ? t[2].replace(/\.?$/, ".") : "", s.note].filter(Boolean).join(" "); }
    blocks.push({ x:s.b, dur:s.e - s.b, kind:"step", si:s.si, ings, tasks, key:r.id+":"+s.si });
  });
  /* Preheats land 15 minutes before the oven step. */
  let pk = 0;
  r.steps.forEach((st,si)=>st.sents.filter(x=>x.pre).forEach(x=>{
    const oven = steps.find(s=>s.si > si && /\b(bake|roast|oven|broil)\b/i.test(s.text)) || steps.find(s=>s.si >= si);
    blocks.push({ x:(oven ? oven.b : 0) - 15, dur:0, kind:"preheat", ings:[], tasks:[[r.id+":h:"+(pk++), x.t, "Most ovens need about 15 minutes to heat."]] });
  }));
  /* Advance work from ingredient lines runs alongside, finishing before the step that uses it. */
  advItems(r).forEach(p=>{
    const dur = advMin(r, p);
    const users = steps.filter(s=>hits[p.i].includes(s.si));
    const e = users.length ? Math.min(...users.map(s=>s.b)) : (steps.length ? steps[0].b : 0);
    let b = e - dur, note = "";
    const key = r.id + ":a:" + p.i;
    if (ctx.Q(b)) {
      const nb = ctx.search(b-5, e - flexCap(p.prep, dur), x=>!ctx.Q(x));
      if (nb != null) { note = " Starts earlier so it begins in your available hours."; b = nb; }
    }
    blocks.push({ x:b, dur:0, kind:"advance", ings:[{ raw:scaleLine(p.raw, k), prepped:false, again:false }], key,
      tasks:[[r.id+":a:"+p.i, "Start ahead. " + cap(p.name) + ": " + p.prep, "Needs about " + fmtDur(dur) + " before it's used." + note]] });
  });
  if (!servedInSteps) blocks.push({ x:0, dur:0, kind:"serve", ings:[], tasks:[[r.id+":s","Plate and serve",""]] });
  const pitems = prepItems(r);
  const pm = pitems.length ? prepMin(r) : 0;
  return {
    blocks, prepDur: pm, firstStart: steps.length ? steps[0].b : 0,
    prepIngs: pitems.map(p=>({ raw:scaleLine(p.raw, k), prepped:false })),
    prepTasks: pitems.map(p=>[r.id+":p:"+p.i, (/\b(for garnish|for serving|to serve|toppings?)\b/i.test(p.raw) ? "Garnishes" : cap(p.name))+": "+p.prep, ""]).concat(pm ? [[r.id+":p:gather","Measure out everything else for this recipe",""]] : [])
  };
}
function batchNote(t, k){
  if (k < 2) return "";
  if (/\b(brown|sear|saut[eé]|fry|crisp)\b/i.test(t)) return "Big batch: work in batches so it browns instead of steaming.";
  if (/\b(bake|roast)\b/i.test(t)) return "Big batch: a fuller oven or bigger pan runs slower. Go by doneness, not just the clock.";
  if (/\b(boil|simmer)\b/i.test(t)) return "Big batch: a fuller pot takes longer to come up to temperature.";
  return "";
}

/* ---------- meal plan ----------
   Each recipe finishes at its own ready-by (r.readyBy on the meal entry) or, by default, the meal's.
   Recipes that share a ready-by share one prep block, right before the first of them starts cooking.
   Positions are minutes relative to the plan reference G (the meal ready-by, or the latest recipe ready-by). */
let PLAN = { total:0, blocks:[], conflicts:[], notes:[], multiDay:false, start:0, startMs:null, endMs:null, info:{} };
function planRef(){ const ends = S.recipes.map(r=>r.readyBy).filter(Boolean); return S.target || (ends.length ? Math.max(...ends) : null); }
function buildPlan(){
  const G = planRef();
  const conflicts = [], notes = [], all = [], groups = new Map(), info = {};
  const per = S.recipes.map(r=>{
    const R = r.readyBy || G;
    const ctx = makeCtx(R);
    const p = recipeSchedule(r, ctx);
    const d = (R && G) ? (R - G)/60000 : 0;
    ctx.conflicts.forEach(c=>conflicts.push(Object.assign({ ms: R ? R + c.x*60000 : null, rid:r.id }, c)));
    notes.push(...ctx.notes);
    const x = { r, p, R, d };
    const gk = r.readyBy ? "t" + r.readyBy : "meal";
    if (p.prepDur) { if (!groups.has(gk)) groups.set(gk, []); groups.get(gk).push(x); }
    info[r.id] = { start: p.blocks.length ? Math.min(...p.blocks.map(b=>b.x)) + d : d, end: d };
    return x;
  });
  groups.forEach((list, gk)=>{
    const { R, d } = list[0];
    const ctx = makeCtx(R);
    const sum = list.reduce((a,x)=>a + x.p.prepDur, 0);
    const e = Math.min(...list.map(x=>x.p.firstStart));
    let b = e - sum;
    const key = "prep:" + gk;
    const names = list.map(x=>x.r.name).join(" + ");
    if (!ctx.ok(b, e, true) && !S.approved[key]) {
      const nb = ctx.search(b-5, b - 1440, x=>ctx.ok(x, x + sum, true));
      if (nb != null) { notes.push({ name:names, text:"Prep moved earlier to keep it in your available hours." }); b = nb; }
      else { const c = { key, x:b, ms: R ? R + b*60000 : null, name:names, text:"Prep work" }; conflicts.push(c); list.forEach(x=>{ (info[x.r.id].extra = info[x.r.id].extra || []).push(c); }); }
    }
    list.forEach(({r,p})=>{ all.push({ x:b + d, dur:sum, kind:"prep", r, ings:p.prepIngs, tasks:p.prepTasks, key }); info[r.id].start = Math.min(info[r.id].start, b + d); });
  });
  per.forEach(({r,p,d})=>p.blocks.forEach(bl=>all.push(Object.assign({ r }, bl, { x: bl.x + d }))));
  const xs = all.map(a=>a.x);
  const start = xs.length ? Math.min(...xs) : 0, endX = xs.length ? Math.max(...xs) : 0;
  const byOff = new Map();
  all.forEach(b=>{
    const off = Math.max(0, Math.round(b.x - start));
    if (!byOff.has(off)) byOff.set(off, { off, groups:[], kinds:new Set(), dur:0, keys:new Set() });
    const B = byOff.get(off);
    B.kinds.add(b.kind); B.dur = Math.max(B.dur, b.dur); if (b.key) B.keys.add(b.key);
    let g = B.groups.find(x=>x.rid===b.r.id);
    if (!g) { g = { rid:b.r.id, label:b.r.name, color:b.r.color, ings:[], tasks:[] }; B.groups.push(g); }
    g.ings.push(...b.ings); g.tasks.push(...b.tasks);
  });
  const blocks = [...byOff.values()].sort((a,b)=>a.off-b.off);
  blocks.forEach(B=>{
    if (B.kinds.size===1 && B.kinds.has("serve")) B.headline = B.off === Math.round(endX - start) ? "Ready. Plate and serve." : B.groups.map(g=>g.label).join(" + ") + (B.groups.length > 1 ? " are" : " is") + " ready.";
    else if (B.kinds.has("prep")) B.headline = "Prep work. Get everything cut and measured.";
    else if (B.groups.length > 1) B.headline = B.groups.map(g=>g.label).join(" + ");
    else B.headline = short(B.groups[0].tasks[0][1], 90);
    B.conflicts = conflicts.filter(c=>B.keys.has(c.key));
  });
  const total = endX - start;
  const startMs = G ? G + start*60000 : null, endMs = G ? G + endX*60000 : null;
  Object.keys(info).forEach(id=>{
    const I = info[id];
    I.startMs = G ? G + I.start*60000 : null; I.endMs = G ? G + I.end*60000 : null;
    I.conflicts = conflicts.filter(c=>c.rid===id).concat(I.extra || []);
  });
  const multiDay = G ? dayKey(startMs) !== dayKey(endMs) : total >= 1440;
  PLAN = { total, blocks, conflicts, notes, multiDay, start, startMs, endMs, info };
  if (S.idx >= blocks.length) S.idx = 0;
}

/* ============================================================
   Time
   ============================================================ */
function anchor(){ return S.startAt || PLAN.startMs || null; }
function fmt(ms, withDay){
  const d = new Date(ms);
  let h = d.getHours(), m = d.getMinutes(), ap = h>=12 ? "pm" : "am";
  h = h%12 || 12;
  let s = h + ":" + String(m).padStart(2,"0") + ap;
  if (withDay) {
    const t0 = new Date(); t0.setHours(0,0,0,0);
    const d0 = new Date(ms); d0.setHours(0,0,0,0);
    const diff = Math.round((d0 - t0)/86400000);
    s += diff===0 ? " today" : diff===1 ? " tomorrow" : diff===-1 ? " yesterday" : " " + d.toLocaleDateString([], {weekday:"short"});
  }
  return s;
}
function rel(off){ const h=Math.floor(off/60), m=off%60; return "+" + h + ":" + String(m).padStart(2,"0"); }
function wday(ms){ return new Date(ms).toLocaleDateString([], {weekday:"short"}); }
function label(B){ const a = anchor(); if (!a) return rel(B.off); const ms = a + B.off*60000; return PLAN.multiDay ? wday(ms) + " " + fmt(ms) : fmt(ms); }
function wdate(ms){ return new Date(ms).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}); }
function whenX(ms){ return ms ? wdate(ms) + ", " + fmt(ms) : ""; }
function mdy(ms){ const d = new Date(ms); return wday(ms) + " " + (d.getMonth()+1) + "/" + d.getDate(); }
function dtLocal(ms){ const d = new Date(ms), z = n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes()); }

   Rendering
   ============================================================ */
const main = document.getElementById("main"), tl = document.getElementById("timeline"), tools = document.getElementById("tools"), nav = document.getElementById("nav");

function renderTools(){
  const list = S.recipes.length ? `<button class="chip-btn ${S.view==="list"?"set":""}" data-act="list" type="button">Shopping list</button>` : "";
  if (S.view === "setup") { tools.innerHTML = list + (S.recipes.length ? `<button class="chip-btn" data-act="cook" type="button">Cook view</button>` : ""); return; }
  if (S.view === "list") { tools.innerHTML = `<button class="chip-btn" data-act="setup" type="button">Recipes</button><button class="chip-btn" data-act="cook" type="button">Cook view</button>`; return; }
  tools.innerHTML = `<button class="chip-btn" data-act="setup" type="button">Recipes</button>` + list
    + `<button class="chip-btn ${S.target?"set":""}" data-act="ready" type="button">${S.target ? "Eat "+fmt(S.target, true).replace(" today","") : "Eat at"}</button>`
    + (anchor() ? `<button class="chip-btn" data-act="now" type="button">Now</button>` : "")
    + `<button class="chip-btn" data-act="reset" type="button">Reset</button>`;
}

function render(){
  renderTools();
  if (S.view === "setup") return renderSetup();
  if (S.view === "list") return renderList();

}

/* ---------- setup ---------- */
let importMsg = "", importErr = false, busy = false, pasteOpen = false;
try { const m = sessionStorage.getItem("rgp-msg"); if (m) { importMsg = m; sessionStorage.removeItem("rgp-msg"); } } catch(e) {}
function totalFor(r){ const p = recipeSchedule(r, makeCtx(null)); return -Math.min(0, p.firstStart - p.prepDur, ...p.blocks.map(b=>b.x)); }
function renderSetup(){
  tl.innerHTML = ""; tl.style.display = "none"; nav.style.display = "none";
  let h = `<h2>Add a recipe</h2>
  <div class="card">
    <form id="urlForm" class="row" autocomplete="off">
      <input class="field" id="url" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="Paste a recipe link" aria-label="Recipe link">
      <button class="btn go" type="submit" ${busy?"disabled":""}>${busy?"Reading":"Import"}</button>
    </form>
    ${importMsg ? `<div class="msg ${importErr?"err":"ok"}">${esc(importMsg)}</div>` : ""}
    <button class="linkbtn" type="button" data-act="togglePaste">${pasteOpen ? "Hide paste box" : "Or paste the recipe text"}</button>
    ${pasteOpen ? `<textarea class="field" id="paste" placeholder="Paste the title, ingredients and instructions. Headings like Ingredients and Instructions help."></textarea>
      <div class="row" style="margin-top:10px"><button class="btn go" type="button" data-act="addPaste" style="flex:1">Add recipe</button></div>` : ""}
    <a class="linkbtn" href="builder.html" style="display:block">Or build one from your head</a>
  </div>`;

  h += `<h2>This meal</h2>`;
  if (!S.recipes.length) h += `<div class="empty">No recipes yet. Add one or more and they'll be timed to finish together.</div>`;
  S.recipes.forEach((r,ri)=>{
    const t = totalFor(r);
    const open = !!S.open[r.id];
    h += `<div class="rc" style="--c:${r.color}">
      <div class="nm">${esc(r.name)}</div>
      <div class="meta">${r.ings.length} ingredients · ${r.steps.length} steps · ${fmtDur(t)} planned${servings(r) ? " · " + servings(r) : ""}${r.url ? `<br><a href="${esc(r.url)}" style="color:var(--muted)">${esc(r.url.replace(/^https?:\/\/(www\.)?/,"").slice(0,60))}</a>` : ""}</div>
      <div class="batch" role="group" aria-label="Batch size">${BATCHES.map(b=>`<button type="button" class="${(r.k||1)===b?"on":""}" data-act="batch" data-id="${r.id}" data-k="${b}">${b===0.5?"½":b}x</button>`).join("")}</div>
      ${rbHtml(r)}
      <div class="acts">
        <button class="btn sm" type="button" data-act="review" data-id="${r.id}">${open ? "Close times" : "Review times"}</button>
        <a class="btn sm" href="builder.html?id=${encodeURIComponent(r.id)}" style="display:inline-flex;align-items:center;text-decoration:none">Edit</a>
        <button class="btn sm del" type="button" data-act="remove" data-id="${r.id}">Remove</button>
      </div>`;
    if (open) {
      h += `<div class="rv"><div class="hint" style="margin:0 0 6px">Minutes come from the recipe text${(r.k||1)!==1 ? `, adjusted for a ${r.k}x batch` : ""}. Fix any that look off; an orange box is your override and is saved with the recipe. Clear it to go back to the estimate.</div>`;
      if (prepItems(r).length) {
        const auto = autoPrepMin(r);
        h += `<div class="st"><div class="tx"><b>Prep</b> · ${prepItems(r).map(p=>esc(p.name)).join(", ")}</div>
          <div><input type="number" min="0" inputmode="numeric" data-prep="${r.id}" value="${r.prepOver!=null && r.prepOver!=="" ? r.prepOver : auto}" class="${r.prepOver!=null && r.prepOver!=="" ? "edited":""}" aria-label="Prep minutes"><div class="u">min</div></div></div>`;
      }
      advItems(r).forEach(p=>{
        const ov = r.advOver && r.advOver[p.i]!=null && r.advOver[p.i]!=="";
        h += `<div class="st"><div class="tx"><b>Ahead</b> · ${esc(p.name)}: ${esc(p.prep)}</div>
          <div><input type="number" min="0" inputmode="numeric" data-adv="${r.id}:${p.i}" value="${ov ? r.advOver[p.i] : autoAdvMin(p)}" class="${ov?"edited":""}" aria-label="Minutes ahead"><div class="u">min</div></div></div>`;
      });
      r.steps.forEach((st,si)=>{
        const auto = autoStepMin(r, si);
        const ov = r.over[si]!=null && r.over[si]!=="";
        const text = st.sents.map(s=>s.t).join(" ");
        h += `<div class="st"><div class="tx"><b>Step ${si+1}</b> · ${esc(text)}</div>
          <div><input type="number" min="0" inputmode="numeric" data-step="${r.id}:${si}" value="${ov ? r.over[si] : auto}" class="${ov?"edited":""}" aria-label="Step ${si+1} minutes"><div class="u">min</div></div></div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
  });

  if (S.recipes.length) {
    h += `<h2>Eat at</h2>
    <div class="card">
      <div class="readyrow"><input type="datetime-local" id="readyIn" step="300" value="${S.target ? dtLocal(S.target) : ""}" aria-label="Eat date and time">
      ${S.target ? `<button class="btn" type="button" data-act="clearReady">Clear</button>` : ""}</div>
      <div class="hint">${PLAN.startMs ? `Plan starts <b style="color:var(--accent)">${whenX(PLAN.startMs)}</b>${S.target ? ` to eat ${whenX(S.target)}` : ""}. Total plan: ${fmtDur(PLAN.total)}.` : `Optional. Set it and every step gets a day and clock time. Total plan: ${fmtDur(PLAN.total)}.`}</div>
      <label class="qrow"><input type="checkbox" id="qOn" ${S.quiet.on?"checked":""}> Active hours</label>
      ${S.quiet.on ? `<div class="row qtimes"><input type="time" id="qTo" step="900" value="${S.quiet.to}" aria-label="Active hours start"><span>to</span><input type="time" id="qFrom" step="900" value="${S.quiet.from}" aria-label="Active hours end"></div>` : ""}
      ${quietBlocksHtml()}
      <div class="hint">Hands-on steps outside active hours or inside a quiet time get flagged. Soaks, simmers, thaws and other waits can run any time.${PLAN.startMs ? "" : " Applies once you set a ready-by."}</div>
      ${PLAN.notes.length ? `<div class="hint" style="color:var(--done)">${PLAN.notes.map(n=>esc(n.name + ": " + n.text)).join("<br>")}</div>` : ""}
    </div>`;
    PLAN.conflicts.sort((a,b)=>(a.ms||0)-(b.ms||0));
    if (PLAN.conflicts.length) {
      h += `<h2 style="color:var(--warn)">Needs your OK</h2><div class="card">`;
      PLAN.conflicts.forEach(c=>{ h += `<div class="cf"><div><b>${esc(whenX(c.ms))}</b> · ${esc(c.name)}<br>${esc(short(c.text, 120))}</div>
        <div class="hint" style="margin-top:4px">This hands-on step falls outside your available hours. Move this recipe's ready-by, or approve it.</div>
        <button class="btn sm" type="button" data-act="approve" data-key="${esc(c.key)}" style="margin-top:8px">Approve</button></div>`; });
      h += `</div>`;
    }
    h += `
    <button class="big solid" type="button" data-act="cook">Build the game plan</button>`;
  } else if (!S.library.length) {
    h += `<button class="linkbtn" type="button" data-act="sample">Try it with a sample recipe</button>`;
  }
  h += alertsHtml();
  h += shareHtml();
  h += mealBackupHtml();
  h += boxHtml();
  main.innerHTML = h;
}

/* ---------- weekly quiet times ---------- */

  const bl = S.quiet.blocks || [];

    h += `<div class="qbrow">
      <div class="row"><select class="sel" data-qb="${i}" data-f="days" aria-label="Days">${QDAYS.map(([k,l])=>`<option value="${k}" ${bk.days===k?"selected":""}>${l}</option>`).join("")}</select>
        <button class="btn sm del" type="button" data-act="qbDel" data-i="${i}" aria-label="Remove this quiet time">✕</button></div>
      <div class="row qtimes"><input type="time" step="900" data-qb="${i}" data-f="from" value="${bk.from}" aria-label="From"><span>to</span><input type="time" step="900" data-qb="${i}" data-f="to" value="${bk.to}" aria-label="To"></div>

}

/* ---------- per-recipe ready-by ---------- */
function rbHtml(r){
  const I = PLAN.info[r.id] || {};
  const open = r.readyBy || S.rbOpen === r.id;
  let h = `<div class="rb"><div class="hint" style="margin:0 0 6px">Ready by</div>`;
  if (open) h += `<div class="readyrow"><input type="datetime-local" step="300" data-rb="${r.id}" value="${r.readyBy ? dtLocal(r.readyBy) : ""}" aria-label="Ready by for ${esc(r.name)}"><button class="btn sm" type="button" data-act="rbSame" data-id="${r.id}">Same as meal</button></div>`;
  else h += `<button class="btn sm" type="button" data-act="rbPick" data-id="${r.id}">Same as meal</button>`;
  if (I.startMs) h += `<div class="when2">${r.readyBy ? "Ready " + whenX(I.endMs) + " · " : ""}Starts ${whenX(I.startMs)}</div>`;

  if (cf.length) { const first = Math.min(...cf.map(c=>c.ms)); h += `<div class="warnline">${cf.length === 1 ? "1 hands-on step falls outside your available hours, at " : cf.length + " hands-on steps fall outside your available hours, starting "}${esc(whenX(first))}. Move the ready-by or approve them below.</div>`; }
  return h + `</div>`;
}

/* ---------- recipe box ---------- */
let boxQuery = "", backupOpen = false;
function boxHtml(){
  const inMeal = new Set(S.recipes.map(r=>r.id));
  const q = boxQuery.trim().toLowerCase();
  const list = S.library.slice().sort((a,b)=>(b.used||b.saved||0)-(a.used||a.saved||0))
    .filter(r=>!q || r.name.toLowerCase().includes(q) || (r.url||"").toLowerCase().includes(q));

  list.forEach(r=>{
    const used = r.used ? "Last used " + new Date(r.used).toLocaleDateString([], {month:"short", day:"numeric"}) : "";
    h += `<div class="bx">
      <div class="bxm"><div class="bxn">${esc(r.name)}</div><div class="meta">${r.ings.length} ingredients${used ? " · " + used : ""}</div></div>
      <a class="btn sm" href="builder.html?id=${encodeURIComponent(r.id)}" style="display:inline-flex;align-items:center;text-decoration:none">Edit</a>
      ${inMeal.has(r.id) ? `<span class="inmeal">In meal</span>` : `<button class="btn sm go" type="button" data-act="addLib" data-id="${r.id}">Add</button>`}
      <button class="btn sm del" type="button" data-act="delLib" data-id="${r.id}" aria-label="Delete ${esc(r.name)}">✕</button>
    </div>`;
  });
  if (!list.length) h += `<div class="empty">No matches.</div>`;
  h += `<button class="linkbtn" type="button" data-act="toggleBackup">${backupOpen ? "Hide backup" : "Back up or move your recipe box"}</button>`;
  if (backupOpen) h += `<div class="card"><div class="hint" style="margin-top:0">Your recipe box lives in this browser. To move it to another phone or computer, copy the backup here and paste it into the same box there.</div>
    <textarea class="field" id="backup" style="min-height:120px;margin-top:10px" placeholder="Paste a backup here to restore"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" type="button" data-act="copyBackup" style="flex:1">Copy backup</button><button class="btn go" type="button" data-act="restore" style="flex:1">Restore</button></div>
    ${backupMsg ? `<div class="msg ok">${esc(backupMsg)}</div>` : ""}</div>`;
  return h;
}
let backupMsg = "";

/* ---------- whole-meal backup ----------
   Saves the meal's recipes (with batch sizes, time fixes and per-recipe ready-bys), the eat time,
   active hours and approvals. Checkboxes and the clock are left out so a restored plan starts fresh. */
let mealMsg = "", mealErr = false, mealRestoreOpen = false;
function mealBackup(){
  return { app:"recipe-game-plan", kind:"meal", v:1, exported: Date.now(),
    meal: { recipes: S.recipes, target: S.target, quiet: S.quiet, approved: S.approved } };
}
function mealFileName(){
  const t = S.target || PLAN.endMs || Date.now(), d = new Date(t), z = n=>String(n).padStart(2,"0");
  const slug = (S.recipes[0] ? S.recipes[0].name : "meal").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30);
  return "game-plan-" + d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate()) + "-" + slug + ".json";
}
function mealBackupHtml(){
  let h = `<h2>Back up this meal</h2><div class="card">`;
  if (S.recipes.length) h += `<div class="hint" style="margin-top:0">Saves every recipe in this meal with its batch size, time fixes and ready-by, plus the eat time and active hours. Checkboxes aren't included, so a restored plan starts fresh.</div>
    <div class="row" style="margin-top:10px"><button class="btn go" type="button" data-act="mealDownload" style="flex:1">Download file</button><button class="btn" type="button" data-act="mealCopy" style="flex:1">Copy</button></div>`;
  h += `<button class="linkbtn" type="button" data-act="mealRestoreToggle">${mealRestoreOpen ? "Hide restore" : "Restore a meal from a backup"}</button>`;
  if (mealRestoreOpen) h += `<div class="hint" style="margin-top:0">Pick a backup file or paste a copied backup. It replaces the meal on this phone${S.share ? " and in the shared plan" : ""}. Your recipe box keeps everything and gains any recipes it didn't have.</div>
    <label class="btn" style="display:flex;align-items:center;justify-content:center;margin-top:10px;cursor:pointer">Choose backup file<input type="file" id="mealFile" accept=".json,application/json,text/plain" hidden></label>
    <textarea class="field" id="mealPaste" style="min-height:100px;margin-top:10px" placeholder="Or paste a meal backup here"></textarea>
    <button class="btn go" type="button" data-act="mealRestore" style="width:100%;margin-top:10px">Restore pasted backup</button>`;
  if (mealMsg) h += `<div class="msg ${mealErr ? "err" : "ok"}">${esc(mealMsg)}</div>`;
  return h + `</div>`;
}
function setMealMsg(m, err){ mealMsg = m; mealErr = !!err; const y = window.scrollY; render(); window.scrollTo(0,y); }
function restoreMeal(text){
  let data = null;
  try { data = JSON.parse(text); } catch(e) {}
  const m = data && data.meal;
  if (!m || !Array.isArray(m.recipes) || !m.recipes.every(r=>r && r.id && Array.isArray(r.ings) && Array.isArray(r.steps))) {
    return setMealMsg(data && Array.isArray(data.library) ? "That's a recipe box backup. Restore it in the recipe box section below." : "That doesn't look like a meal backup.", true);
  }
  const go = ()=>{
    S.recipes = JSON.parse(JSON.stringify(m.recipes));
    const used = new Set();
    S.recipes.forEach(r=>{
      if (!r.k) r.k = 1; if (!r.over) r.over = {};
      if (!r.color || used.has(r.color)) r.color = COLORS.find(c=>!used.has(c)) || COLORS[used.size % COLORS.length];
      used.add(r.color);
      if (!S.library.some(x=>x.id===r.id)) S.library.push(libCopy(r));
    });
    S.target = m.target || null;
    if (m.quiet) S.quiet = m.quiet;
    S.approved = m.approved || {};
    S.open = {}; S.rbOpen = null;
    afterChange();
    mealRestoreOpen = false;
    const past = PLAN.startMs && PLAN.startMs < Date.now();
    setMealMsg(`Restored ${S.recipes.length} recipe${S.recipes.length===1?"":"s"}.` + (past ? " This plan's dates are in the past. Set a new eat time above and you can move every ready-by with it." : ""), false);
  };
  if (S.recipes.length) ask(`Replace the ${S.recipes.length} recipe${S.recipes.length===1?"":"s"} in this meal with the backup?`, "Replace", go); else go();
}

/* ---------- shopping list ---------- */
function listText(){
  return S.recipes.map(r=>{
    const head = r.name + ((r.k||1)!==1 ? " (" + r.k + "x)" : "");
    return head + "\n" + r.ings.map(i=>"- " + scaleLine(i, r.k||1)).join("\n");
  }).join("\n\n");
}
let copyMsg = "";
function renderList(){
  tl.innerHTML = ""; tl.style.display = "none"; nav.style.display = "none";
  const total = S.recipes.reduce((a,r)=>a + r.ings.length, 0);
  const have = S.recipes.reduce((a,r)=>a + r.ings.filter((_,i)=>S.have[r.id+":"+i]).length, 0);
  let h = `<div class="ilist"><div class="top2"><div class="title">Shopping list</div><div class="meta">${have} of ${total} checked</div></div>`;
  S.recipes.forEach(r=>{
    h += `<h2 style="color:${r.color}">${esc(r.name)}</h2>
      <div class="batch" role="group" aria-label="Batch size for ${esc(r.name)}">${BATCHES.map(b=>`<button type="button" class="${(r.k||1)===b?"on":""}" data-act="batch" data-id="${r.id}" data-k="${b}">${b===0.5?"½":b}x</button>`).join("")}</div>
      <div class="ings" style="--c:${r.color}"><ul>`;
    r.ings.forEach((line,i)=>{
      const key = r.id+":"+i, on = !!S.have[key];
      h += `<li style="padding:0"><label class="irow ${on?"have":""}"><input type="checkbox" data-have="${key}" ${on?"checked":""}><span class="nm">${esc(scaleLine(line, r.k||1))}</span></label></li>`;
    });
    h += `</ul></div>${servings(r) ? `<div class="hint">${servings(r)}</div>` : ""}`;
  });
  h += `<div class="row" style="margin-top:18px"><button class="btn" type="button" data-act="copyList" style="flex:1">Copy list</button><button class="btn" type="button" data-act="clearHave" style="flex:1">Uncheck all</button></div>
    ${copyMsg ? `<div class="msg ok">${esc(copyMsg)}</div>` : ""}</div>`;
  main.innerHTML = h;
}
function hhmm(ms){ const d=new Date(ms); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

/* ---------- cook ---------- */
function blockIds(B){ return B.groups.flatMap(g=>g.tasks.map(t=>t[0])); }
function complete(B){ return blockIds(B).every(id=>S.done[id]); }
function mins(n){ return fmtDur(Math.abs(Math.round(n))); }
function statusHtml(i){
  const a = anchor(); if (!a) return "";
  const end = PLAN.endMs;
  if (!S.startAt) return i===0 && end ? `<div class="status">Start this at <b>${whenX(a)}</b> to be ready at <b>${whenX(end)}</b>.</div>` : "";
  if (!end) return "";
  const proj = S.startAt + PLAN.total*60000, diff = (proj - end)/60000;
  if (Math.abs(diff) < 3) return `<div class="status ok">On track for <b>${whenX(end)}</b>.</div>`;
  if (diff > 0) return `<div class="status late">Started <b>${mins(diff)} late</b>. Projected ready ${whenX(proj)}.</div>`;
  return `<div class="status ok">Started <b>${mins(diff)} early</b>. Projected ready ${whenX(proj)}. Hold finished food warm until ${whenX(end)}.</div>`;
}
function renderCook(){
  tl.style.display = ""; nav.style.display = "";
  const blocks = PLAN.blocks;
  if (!blocks.length) { S.view = "setup"; return render(); }
  const B = blocks[S.idx];
  const anc = anchor(), byDay = anc && PLAN.multiDay;
  let lastDay = "";
  tl.innerHTML = blocks.map((x,i)=>{
    let head = "";
    if (byDay) { const ms = anc + x.off*60000, dk = dayKey(ms); if (dk !== lastDay) { lastDay = dk; head = `<span class="tlday">${mdy(ms)}</span>`; } }
    return head + `<button type="button" role="tab" aria-selected="${i===S.idx}" class="tl ${i===S.idx?"cur":""} ${complete(x)?"complete":""}" data-i="${i}">${byDay ? fmt(anc + x.off*60000) : label(x)}${complete(x)?" ✓":""}</button>`;
  }).join("");
  const all = blockIds(B), n = all.filter(id=>S.done[id]).length;
  const a = anchor();
  const big = a ? fmt(a + B.off*60000) : rel(B.off);
  const dayNote = a && fmt(a + B.off*60000, true).split(" ")[1] !== "today" ? " · " + fmt(a + B.off*60000, true).split(" ").slice(1).join(" ") : "";
  const dayHead = a && PLAN.multiDay ? `<div class="dayh">${new Date(a + B.off*60000).toLocaleDateString([], {weekday:"long", month:"short", day:"numeric"})}</div>` : "";
  let h = dayHead + `<div class="when"><div class="time">${big}</div><div class="count">Step ${S.idx+1} of ${blocks.length} · ${n}/${all.length} done${a ? " · "+rel(B.off)+" from start" : ""}${PLAN.multiDay ? "" : dayNote}${B.dur ? " · about "+fmtDur(B.dur) : ""}</div></div>
    <div class="headline">${esc(B.headline)}</div>
    ${statusHtml(S.idx)}
    ${B.conflicts.filter(c=>!S.approved[c.key]).map(c=>`<div class="status late"><b>Outside your available hours.</b> This hands-on step lands at ${esc(whenX(c.ms))}. Move this recipe's ready-by, or approve it. <button class="btn sm" type="button" data-act="approve" data-key="${esc(c.key)}" style="margin-top:8px">Approve</button></div>`).join("")}
    <div class="progress"><div style="width:${all.length ? n/all.length*100 : 0}%"></div></div>`;
  B.groups.forEach(g=>{
    h += `<section class="group"><div class="tag" style="color:${g.color}"><i style="background:${g.color}"></i>${esc(g.label)}</div>`;
    if (g.ings.length) {
      h += `<div class="ings" style="--c:${g.color}"><h4>You'll need</h4><ul>` + g.ings.map(x=>
        `<li class="${x.again?"again":""}">${esc(x.raw)}${x.prepped ? `<span class="badge p">prepped</span>` : ""}${x.again ? `<span class="badge a">again</span>` : ""}</li>`).join("") + `</ul></div>`;
    }
    g.tasks.forEach(t=>{
      const on = !!S.done[t[0]];
      h += `<label class="task ${on?"checked":""}"><input type="checkbox" data-id="${esc(t[0])}" ${on?"checked":""}><div><div class="t">${esc(t[1])}</div>${t[2] ? `<div class="d">${esc(t[2])}</div>` : ""}</div></label>`;
    });
    h += `</section>`;
  });
  if (S.idx === 0 && !S.startAt) h += `<button class="big" type="button" data-act="start">Start the clock · I'm starting now</button>`;
  if (S.idx === 0 && S.startAt) h += `<div class="note"><b>Clock started at ${fmt(S.startAt)}.</b> Times follow your actual start.</div>`;
  if (S.idx < blocks.length-1) { const nx = blocks[S.idx+1]; h += `<div class="note"><b>Up next at ${label(nx)}:</b> ${esc(nx.headline)}</div>`; }
  main.innerHTML = h;
  document.getElementById("prev").disabled = S.idx===0;
  const nb = document.getElementById("next");
  nb.disabled = S.idx===blocks.length-1;
  nb.textContent = S.idx===blocks.length-1 ? "Enjoy" : "Next · " + label(blocks[S.idx+1]);
  const cur = tl.querySelector(".cur"); if (cur) cur.scrollIntoView({inline:"center", block:"nearest"});
}

function go(i){ S.idx = Math.max(0, Math.min(PLAN.blocks.length-1, i)); save(); render(); window.scrollTo(0,0); }

/* ============================================================
   Modal (confirm / prompt)
   ============================================================ */
const modal = document.getElementById("modal"), mtext = document.getElementById("mtext");
let modalOk = null;
function ask(html, okLabel, onOk){ mtext.innerHTML = html; document.getElementById("mOk").textContent = okLabel; modalOk = onOk; modal.classList.add("open"); const f = modal.querySelector("input"); if (f) f.focus(); }
document.getElementById("mCancel").onclick = ()=>modal.classList.remove("open");
document.getElementById("mOk").onclick = ()=>{ const f = modalOk; modal.classList.remove("open"); if (f) f(); };
document.addEventListener("keydown", e=>{ if (e.key==="Escape") modal.classList.remove("open"); });


/* ============================================================
   Sharing: the plan lives in D1, every device polls every few seconds.
   S.share = { id, rev }. Recipes, eat time, clock, quiet hours and approvals are shared.
   Each checkbox is sent on its own, so two people never overwrite each other.
   ============================================================ */
const POLL_MS = 4000;
let resetChecks = false, pushTimer = null, pushing = false, lastShared = "", syncErr = "", lastSync = 0, pollTimer = null, polling = false;
const pending = {};  /* checkbox taps not yet confirmed by a poll */
function sharedData(){ return { recipes:S.recipes, target:S.target, startAt:S.startAt, quiet:S.quiet, approved:S.approved }; }
function shareLink(){ return location.origin + location.pathname.replace(/index\.html$/,"") + "?plan=" + S.share.id; }
function queuePush(){
  if (!S.share) return;
  const now = JSON.stringify(sharedData());
  if (now === lastShared && !resetChecks) return;
  clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 500);
}
async function pushNow(){
  pushTimer = null;
  if (!S.share || pushing) { if (S.share) pushTimer = setTimeout(pushNow, 500); return; }
  const data = sharedData(), str = JSON.stringify(data), reset = resetChecks;
  pushing = true; resetChecks = false;
  try {
    const res = await fetch("/api/plan?id=" + S.share.id, { method:"PUT", headers:{"content-type":"application/json"}, body: JSON.stringify({ data, reset }) });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || "Couldn't sync.");
    S.share.rev = j.rev; lastShared = str; syncErr = ""; lastSync = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  } catch(e) { syncErr = e.message || "Couldn't sync. Will keep trying."; if (reset) resetChecks = true; }
  pushing = false;
  if (S.share && (JSON.stringify(sharedData()) !== lastShared || resetChecks)) queuePush();
}
function sendCheck(task, on){
  if (!S.share) return;
  pending[task] = { on, until: Date.now() + 15000 };
  fetch("/api/plan?id=" + S.share.id, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ task, on }) })
    .then(r=>{ if (!r.ok) throw 0; pending[task].until = Date.now() + POLL_MS*2; }, ()=>{})
    .catch(()=>{ syncErr = "A checkbox didn't sync. Check your connection."; });
}
function busyTyping(){ const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox" && main.contains(a); }
function applyRemote(j){
  let changed = false;
  if (j.rev > (S.share.rev || 0) && !pushing && !pushTimer) {
    const d = j.data || {};
    S.recipes = Array.isArray(d.recipes) ? d.recipes : [];
    S.recipes.forEach(r=>{ if (!r.k) r.k = 1; if (!r.over) r.over = {}; if (!S.library.some(x=>x.id===r.id)) S.library.push(libCopy(r)); });
    S.target = d.target || null; S.startAt = d.startAt || null;
    if (d.quiet) S.quiet = d.quiet;
    S.approved = d.approved || {};
    S.share.rev = j.rev; lastShared = JSON.stringify(sharedData());
    buildPlan(); changed = true; queueAlerts();
  }
  const done = {}, have = {};
  Object.keys(j.checks || {}).forEach(k=>{ if (k.startsWith("have:")) have[k.slice(5)] = true; else done[k] = true; });
  const now = Date.now();
  Object.keys(pending).forEach(k=>{
    if (pending[k].until < now) { delete pending[k]; return; }
    const tgt = k.startsWith("have:") ? have : done, kk = k.startsWith("have:") ? k.slice(5) : k;
    if (pending[k].on) tgt[kk] = true; else delete tgt[kk];
  });
  if (JSON.stringify(done) !== JSON.stringify(S.done) || JSON.stringify(have) !== JSON.stringify(S.have)) { S.done = done; S.have = have; changed = true; }
  syncErr = ""; lastSync = now;
  if (changed) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
  return changed;
}
async function poll(){
  if (!S.share || polling || document.hidden) return;
  polling = true;
  try {
    const res = await fetch("/api/plan?id=" + S.share.id, { cache:"no-store" });
    const j = await res.json();
    if (res.status === 404) { syncErr = j.error; }
    else if (!res.ok) throw new Error(j.error);
    else if (applyRemote(j) && !busyTyping()) { const y = window.scrollY; render(); window.scrollTo(0,y); }
  } catch(e) { syncErr = (e && e.message) || "Can't reach the shared plan. Will keep trying."; }
  polling = false;
}
function startPolling(){ clearInterval(pollTimer); if (S.share) { pollTimer = setInterval(poll, POLL_MS); poll(); } }
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) poll(); });
async function startShare(){
  const checks = {};
  Object.keys(S.done).forEach(k=>{ if (S.done[k]) checks[k] = true; });
  Object.keys(S.have).forEach(k=>{ if (S.have[k]) checks["have:"+k] = true; });
  shareMsg = "Creating the link"; render();
  try {
    const res = await fetch("/api/plan", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ data: sharedData(), checks }) });
    let j = null; try { j = await res.json(); } catch(e) {}
    if (!j) throw new Error("Sharing only works on the hosted site (pages.dev).");
    if (!res.ok) throw new Error(j.error);
    S.share = { id:j.id, rev:j.rev }; lastShared = JSON.stringify(sharedData()); save();
    shareMsg = ""; startPolling(); render(); sendLink();
  } catch(e) { shareMsg = e.message || String(e); render(); }
}
function sendLink(){
  const url = shareLink();
  if (navigator.share) navigator.share({ title:"Game plan", text:"Cook with me: " + S.recipes.map(r=>r.name).join(" + "), url }).catch(()=>{});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(()=>{ shareMsg = "Link copied."; render(); }, ()=>{ shareMsg = url; render(); });
  else { shareMsg = url; render(); }
}
async function joinShare(id){
  try {
    const res = await fetch("/api/plan?id=" + encodeURIComponent(id), { cache:"no-store" });
    let j = null; try { j = await res.json(); } catch(e) {}
    if (!j) throw new Error("Sharing only works on the hosted site (pages.dev).");
    if (!res.ok) throw new Error(j.error);
    S.share = { id, rev:0 }; S.idx = 0; S.view = "setup";
    applyRemote(j);
    importMsg = "Joined the shared plan. Checkboxes and changes sync both ways."; importErr = false;
    save(); startPolling();
  } catch(e) { importMsg = e.message || String(e); importErr = true; }
  render();
}
let shareMsg = "";
function shareHtml(){
  if (!S.recipes.length) return "";
  let h = `<h2>Share</h2><div class="card">`;
  if (!S.share) h += `<div class="hint" style="margin-top:0">Send a link so someone else can cook from this plan with you. Checkboxes, times and changes stay in sync on both phones.</div>
    <button class="btn go" type="button" data-act="share" style="width:100%;margin-top:10px">Share this plan</button>`;
  else {
    const ago = lastSync ? Math.round((Date.now() - lastSync)/1000) : null;
    h += `<div class="hint" style="margin-top:0">${syncErr ? `<span style="color:var(--warn)">${esc(syncErr)}</span>` : `Shared. Changes sync every few seconds${ago!=null ? ` (last sync ${ago < 5 ? "just now" : ago + "s ago"})` : ""}.`}</div>
      <div class="row" style="margin-top:10px"><button class="btn go" type="button" data-act="sendLink" style="flex:1">Send link</button><button class="btn" type="button" data-act="leaveShare" style="flex:1">Stop sharing here</button></div>`;
  }
  if (shareMsg) h += `<div class="msg ok" style="word-break:break-all">${esc(shareMsg)}</div>`;
  return h + `</div>`;
}


/* ============================================================
   Step alerts: a push notification on this phone when each block is due, even with the app closed.
   The phone sends its upcoming alert times to /api/push; a cron Worker calls the send step every minute.
   S.alerts = { on, device }. While the app is open without push, a chime and banner fill in.
   ============================================================ */
let alertTimer = null, alertsLast = "", alertMsg = "", alertErr = false, alertBusy = false;
const pushOK = ()=>"serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function b64uToBytes(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); const raw = atob(s + "===".slice((s.length + 3) % 4)); return Uint8Array.from(raw, c=>c.charCodeAt(0)); }
function blockWho(B){ return B.groups.map(g=>g.label).join(" + "); }
function alertItems(){
  const a = anchor(); if (!a) return [];
  const now = Date.now();
  return PLAN.blocks.filter(B=>!complete(B)).map(B=>{
    const at = a + B.off*60000;
    const first = B.groups[0] && B.groups[0].tasks[0] ? B.groups[0].tasks[0][1] : "";
    const body = B.headline === blockWho(B) ? short(B.groups.map(g=>g.tasks[0] ? g.tasks[0][1] : "").filter(Boolean).join(" Also: "), 200) : B.headline;
    return { at, title: fmt(at) + " · " + short(blockWho(B), 60), body: body || first, tag: "rgp-" + B.off };
  }).filter(x=>x.at > now - 60000);
}
async function currentSub(){ const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
function queueAlerts(){
  if (!S.alerts || !S.alerts.on) return;
  clearTimeout(alertTimer); alertTimer = setTimeout(syncAlerts, 1500);
}
async function syncAlerts(force){
  if (!S.alerts || !S.alerts.on || !pushOK()) return;
  const items = alertItems(), str = JSON.stringify(items);
  if (str === alertsLast && !force) return;
  try {
    const sub = await currentSub();
    if (!sub) throw new Error("This phone's alert subscription expired. Turn alerts off and on again.");
    const res = await fetch("/api/push", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ device:S.alerts.device, sub, items }) });
    const j = await res.json(); if (!res.ok) throw new Error(j.error);
    alertsLast = str; alertErr = false; alertMsg = "";
  } catch(e) { alertErr = true; alertMsg = e.message || "Couldn't update alerts. Will try again."; }
}
async function enableAlerts(){
  if (!pushOK()) { alertErr = true; alertMsg = /iPhone|iPad/.test(navigator.userAgent) ? "On iPhone, add this app to your Home Screen first (Share, then Add to Home Screen), open it from there, and try again." : "This browser can't do push alerts. Keep the app open and it will chime instead."; render(); return; }
  alertBusy = true; alertMsg = ""; render();
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("Notifications are blocked for this site. Allow them in your browser's site settings, then try again.");
    const reg = await navigator.serviceWorker.register("/sw.js");
    await navigator.serviceWorker.ready;
    const kr = await fetch("/api/push?key=1"); let kj = null; try { kj = await kr.json(); } catch(e) {}
    if (!kj || !kj.publicKey) throw new Error(kj && kj.error ? kj.error : "Alerts only work on the hosted site (pages.dev).");
    let sub = await reg.pushManager.getSubscription();
    if (sub) { const cur = sub.options && sub.options.applicationServerKey; if (cur && btoa(String.fromCharCode(...new Uint8Array(cur))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"") !== kj.publicKey) { await sub.unsubscribe(); sub = null; } }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64uToBytes(kj.publicKey) });
    const dev = (S.alerts && S.alerts.device) || Array.from(crypto.getRandomValues(new Uint8Array(16)), b=>"abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
    S.alerts = { on:true, device:dev };
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
    alertsLast = ""; await syncAlerts(true);
    if (!alertErr) alertMsg = "Alerts are on for this phone.";
  } catch(e) { alertErr = true; alertMsg = e.message || String(e); }
  alertBusy = false; render();
}
async function disableAlerts(){
  const dev = S.alerts && S.alerts.device;
  S.alerts = { on:false, device:dev }; save();
  try { if (dev) await fetch("/api/push?device=" + dev, { method:"DELETE" }); const sub = pushOK() && await currentSub(); if (sub) await sub.unsubscribe(); } catch(e) {}
  alertMsg = "Alerts are off for this phone."; alertErr = false; render();
}
async function testAlert(){
  try {
    const sub = await currentSub();
    const res = await fetch("/api/push", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ device:S.alerts.device, sub, test:true, when: fmt(Date.now()) }) });
    if (!res.ok) throw new Error((await res.json()).error);
    alertErr = false; alertMsg = "Test queued. Waiting for the next tick, up to a minute. You can switch apps.";
    render(); watchTest(Date.now());
    return;
  } catch(e) { alertErr = true; alertMsg = e.message || "Couldn't send a test."; }
  render();
}
/* Report what the push service said about the test, so a missing notification can be traced. */
async function watchTest(since){
  for (let i = 0; i < 24; i++) {
    await new Promise(r=>setTimeout(r, 5000));
    let j = null;
    try { j = await (await fetch("/api/push?status=1&device=" + S.alerts.device, { cache:"no-store" })).json(); } catch(e) { continue; }
    if (!j || !j.found) { alertErr = true; alertMsg = "This phone isn't registered for alerts anymore. Tap Turn off, then Turn on alerts again."; render(); return; }
    if (j.lastAt && j.lastAt >= since - 1000) {
      if (j.lastStatus >= 200 && j.lastStatus < 300) { alertErr = false; alertMsg = `Sent at ${fmt(j.lastAt)} and accepted by the push service (${j.host}). If no notification appeared, Android may be blocking Chrome's notifications: Settings, Apps, Chrome, Notifications.`; }
      else { alertErr = true; alertMsg = `The push service (${j.host}) refused it: ${j.lastStatus || "no response"} ${j.lastBody || ""}`.trim(); }
      const y = window.scrollY; render(); window.scrollTo(0,y); return;
    }
  }
  alertErr = true; alertMsg = "No tick picked up the test in two minutes. Check that the rgp-ticker Worker's cron trigger is saved and set to every minute.";
  const y = window.scrollY; render(); window.scrollTo(0,y);
}
function alertsHtml(){
  if (!S.recipes.length) return "";
  const on = S.alerts && S.alerts.on;
  const next = alertItems()[0];
  let h = `<h2>Step alerts</h2><div class="card">`;
  if (!on) h += `<div class="hint" style="margin-top:0">Get a notification on this phone when each step is due, even with the app closed. Everyone on a shared plan can turn on their own.</div>
    <button class="btn go" type="button" data-act="alertsOn" style="width:100%;margin-top:10px" ${alertBusy?"disabled":""}>${alertBusy ? "Turning on" : "Turn on alerts"}</button>`;
  else h += `<div class="hint" style="margin-top:0">${next ? `On for this phone. Next alert <b style="color:var(--accent)">${whenX(next.at)}</b>: ${esc(next.title.split(" · ").slice(1).join(" · "))}.` : anchor() ? "On for this phone. Nothing left to alert in this plan." : "On for this phone. Set an eat time or start the clock and alerts get scheduled."}</div>
    <div class="row" style="margin-top:10px"><button class="btn" type="button" data-act="alertTest" style="flex:1">Send a test</button><button class="btn" type="button" data-act="alertsOff" style="flex:1">Turn off</button></div>`;
  if (alertMsg) h += `<div class="msg ${alertErr ? "err" : "ok"}">${esc(alertMsg)}</div>`;
  return h + `</div>`;
}

/* In-app fallback while the app is open and push alerts are off: chime, buzz and a banner. */
let lastTick = Date.now(), banner = null;
function chime(){
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = chime.ctx || (chime.ctx = new C()); const t = ctx.currentTime;
    [0, .28, .56].forEach((d,i)=>{ const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = i===2 ? 1046 : 880; g.gain.setValueAtTime(0.0001, t+d); g.gain.exponentialRampToValueAtTime(0.3, t+d+.02); g.gain.exponentialRampToValueAtTime(0.0001, t+d+.24); o.connect(g).connect(ctx.destination); o.start(t+d); o.stop(t+d+.26); });
  } catch(e) {}
}
function showBanner(B, i){
  banner = { i, text: B.headline, who: blockWho(B) };
  let el = document.getElementById("banner");
  if (!el) { el = document.createElement("div"); el.id = "banner"; document.body.appendChild(el); }
  el.innerHTML = `<div class="bn"><div><b>Time for the next step</b><br>${esc(short(banner.who, 60))}: ${esc(short(banner.text, 110))}</div><div class="row" style="margin-top:10px"><button class="btn sm go" type="button" data-act="bannerGo">Show me</button><button class="btn sm" type="button" data-act="bannerX">Dismiss</button></div></div>`;
  el.style.display = "block";
}
function hideBanner(){ const el = document.getElementById("banner"); if (el) el.style.display = "none"; banner = null; }
setInterval(()=>{
  const now = Date.now(), prev = lastTick; lastTick = now;
  if (S.alerts && S.alerts.on) return;
  const a = anchor(); if (!a || document.hidden) return;
  let hit = -1;
  PLAN.blocks.forEach((B,i)=>{ const at = a + B.off*60000; if (at > prev && at <= now && !complete(B)) hit = i; });
  if (hit < 0) return;
  chime(); if (navigator.vibrate) navigator.vibrate([250,120,250,120,250]);
  showBanner(PLAN.blocks[hit], hit);
}, 15000);
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e=>{ if (e.data && e.data.type === "rgp-now") jumpNow(); });
function jumpNow(){
  const a = anchor(); if (!a) return;
  const el = (Date.now() - a)/60000; let pick = 0;
  PLAN.blocks.forEach((b,i)=>{ if (el >= b.off) pick = i; });
  S.view = "cook"; go(pick);
}
