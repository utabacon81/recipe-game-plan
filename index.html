async function importUrl(u){
  u = u.trim();
  busy = true; importMsg = ""; render();
  try {
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    let res, data = null;
    try { res = await fetch("/api/recipe?url=" + encodeURIComponent(u)); } catch(e) { throw new Error("Couldn't reach the import service. Check your connection, or paste the recipe text instead."); }
    try { data = await res.json(); } catch(e) {}
    if (!data) throw new Error(location.hostname.endsWith("pages.dev") || location.hostname.includes("cloudflare")
      ? "The import service didn't answer. Check that the functions folder deployed in Cloudflare, or paste the recipe text instead."
      : "Link import only works on the hosted site (pages.dev). Paste the recipe text instead.");
    const host = (()=>{ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e) { return ""; } })();
    let r = null;
    if (data.recipe) r = fromJsonLd(data.recipe, data.url || u);
    else if (data.text) { r = fromText(data.text, ""); r.name = data.title || (host ? "Recipe from " + host : "Imported recipe"); r.url = u; }
    if (!r) throw new Error((data.error || "Couldn't read that page.") + (data.tried ? " (Tried: " + data.tried.map(t=>t.via + " " + t.status).join(", ") + ")" : ""));
    if (!r.steps.length || !r.ings.length) throw new Error("Found the page but couldn't pick out the ingredients and steps. Paste the text instead.");
    const dupe = S.library.find(x=>x.url && x.url === r.url);
    if (dupe) { if (!addToMeal(dupe, 1)) throw new Error(dupe.name + " is already in this meal."); afterChange(); importMsg = `${dupe.name} was already in your recipe box, so I added that copy with your saved times.`; importErr = false; busy = false; render(); return; }
    addToMeal(r, 1); S.open[r.id] = true; afterChange();
    importMsg = `Added ${r.name}${data.via && data.via !== "site" ? " (read through a backup route, so double check it)" : ""}. Check the step times below.`; importErr = false;
  } catch(e) {
    importMsg = e.message || String(e); importErr = true; pasteOpen = true;
  }
  busy = false; render();
}
function afterChange(){ buildPlan(); S.done = {}; S.idx = 0; S.startAt = null; resetChecks = true; save(); }

const SAMPLE = `Pat's Beef and Pork Chili
Ingredients
6 slices thick-cut applewood smoked bacon, cut into 1/2-inch pieces
4 cloves garlic, finely chopped
2 medium onions, finely chopped
1 red bell pepper, chopped
1 yellow bell pepper, chopped
3 tablespoons chili powder
1 tablespoon ground cumin
1 tablespoon chipotle chili powder
2 teaspoons dried oregano
1 tablespoon smoked paprika
Salt and freshly ground black pepper
1 pound 85% lean ground beef
1 pound ground pork
1 1/2 cups beer
12 ounces dry chili mix beans, brined overnight and drained
24 ounces crushed tomatoes
24 ounces diced tomatoes, with juice
Lime wedges, sour cream, shredded Cheddar and sliced scallions, for garnish
Instructions
Cover the beans with water by 2 inches and bring to a full rolling boil for 10 minutes. Reduce to a gentle simmer until tender, 45 to 60 minutes. Drain.
In a Dutch oven over medium heat, cook the bacon until lightly crisp, about 8 minutes.
Add the garlic, onions, bell peppers and spices. Season with salt and pepper and cook until the vegetables are tender, about 8 minutes.
Add the beef and break it up. When it starts to brown, add the pork and cook until no longer pink, about 4 minutes.
Stir in the beer and beans, then add the crushed and diced tomatoes.
Reduce the heat to low and simmer for 1 1/2 hours. Adjust the seasoning.

document.addEventListener("submit", e=>{
  if (e.target.id !== "urlForm") return;
  e.preventDefault();
  const u = document.getElementById("url").value.trim();
  if (u) importUrl(u);
});
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]");
  if (t) {
    const act = t.dataset.act, id = t.dataset.id;
    const r = id && S.recipes.find(x=>x.id===id);
    if (act==="togglePaste") { pasteOpen = !pasteOpen; render(); }
    else if (act==="addPaste" || act==="sample") {
      const text = act==="sample" ? SAMPLE : (document.getElementById("paste")||{}).value || "";
      const rec = fromText(text);
      if (!rec.ings.length || !rec.steps.length) { importMsg = "Couldn't find both ingredients and steps. Put an Ingredients heading and an Instructions heading above each list."; importErr = true; render(); return; }
      addToMeal(rec, 1); S.open[rec.id] = true; afterChange();
      importMsg = `Added ${rec.name}. Check the step times below.`; importErr = false; pasteOpen = false; render();
    }
    else if (act==="batch" && r) { r.k = +t.dataset.k; syncLib(r); buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); }
    else if (act==="list") { S.view = "list"; copyMsg = ""; save(); render(); window.scrollTo(0,0); }
    else if (act==="copyList") { const txt = listText(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{ copyMsg = "Copied. Paste it into a note or a text."; render(); }, ()=>{ copyMsg = "Couldn't copy here. Long-press to select the list instead."; render(); }); }
    else if (act==="clearHave") { Object.keys(S.have).forEach(k=>sendCheck("have:"+k, false)); S.have = {}; save(); render(); }
    else if (act==="share") startShare();
    else if (act==="alertsOn") enableAlerts();
    else if (act==="alertsOff") disableAlerts();
    else if (act==="alertTest") testAlert();
    else if (act==="bannerGo") { const i = banner ? banner.i : 0; hideBanner(); S.view = "cook"; buildPlan(); go(i); }
    else if (act==="bannerX") hideBanner();
    else if (act==="qbAdd") { S.quiet.blocks = S.quiet.blocks || []; S.quiet.blocks.push({ days:"wkd", from:"10:00", to:"16:00", short:0 }); buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); }
    else if (act==="qbDel") { (S.quiet.blocks || []).splice(+t.dataset.i, 1); buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); }
    else if (act==="rbPick" && r) { S.rbOpen = r.id; render(); const f = main.querySelector(`[data-rb="${r.id}"]`); if (f) { f.focus(); if (f.showPicker) try { f.showPicker(); } catch(e) {} } }
    else if (act==="rbSame" && r) { delete r.readyBy; S.rbOpen = null; buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); }
    else if (act==="sendLink") sendLink();
    else if (act==="leaveShare") ask("Stop syncing this plan on this phone? It stays here as your own copy, and the other people keep theirs.", "Stop sharing", ()=>{ S.share = null; clearInterval(pollTimer); shareMsg = ""; save(); render(); });
    else if (act==="addLib") { const L = S.library.find(x=>x.id===id); if (L && addToMeal(L, 1)) { afterChange(); importMsg = `Added ${L.name} from your recipe box.`; importErr = false; render(); } }
    else if (act==="delLib") { const L = S.library.find(x=>x.id===id); if (L) ask(`Delete <b>${esc(L.name)}</b> from your recipe box?${S.recipes.some(x=>x.id===id) ? " It stays in this meal until you remove it." : ""}`, "Delete", ()=>{ S.library = S.library.filter(x=>x.id!==id); save(); render(); }); }
    else if (act==="mealDownload") {
      const blob = new Blob([JSON.stringify(mealBackup(), null, 1)], { type:"application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = mealFileName();
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
      setMealMsg("Saved " + a.download + " to your downloads.");
    }
    else if (act==="mealCopy") { const txt = JSON.stringify(mealBackup()); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>setMealMsg("Copied. Paste it into a note or an email to yourself."), ()=>setMealMsg("Couldn't copy here. Use Download file instead.", true)); }
    else if (act==="mealRestoreToggle") { mealRestoreOpen = !mealRestoreOpen; mealMsg = ""; render(); }
    else if (act==="mealRestore") { const box = document.getElementById("mealPaste"); restoreMeal(box ? box.value : ""); }
    else if (act==="toggleBackup") { backupOpen = !backupOpen; backupMsg = ""; render(); }
    else if (act==="copyBackup") { const txt = JSON.stringify({ app:"recipe-game-plan", v:1, library:S.library }); const box = document.getElementById("backup"); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{ backupMsg = `Copied ${S.library.length} recipes.`; render(); }, ()=>{ if (box) { box.value = txt; box.select(); } backupMsg = "Couldn't copy automatically. The backup is in the box, so select and copy it."; }); }
    else if (act==="restore") {
      const box = document.getElementById("backup"); let data = null;
      try { data = JSON.parse(box.value); } catch(e) {}
      if (data && data.kind === "meal") { restoreMeal(box.value); return; }
      if (!data || !Array.isArray(data.library)) { backupMsg = "That doesn't look like a recipe box backup."; render(); return; }
      let n = 0; data.library.forEach(x=>{ if (x && x.id && Array.isArray(x.ings) && Array.isArray(x.steps) && !S.library.some(y=>y.id===x.id)) { S.library.push(x); n++; } });
      backupMsg = `Restored ${n} recipe${n===1?"":"s"}.`; save(); render();
    }
    else if (act==="review" && r) { S.open[id] = !S.open[id]; save(); render(); }
    else if (act==="remove" && r) ask(`Remove <b>${esc(r.name)}</b> from this meal?`, "Remove", ()=>{ S.recipes = S.recipes.filter(x=>x.id!==id); delete S.open[id]; afterChange(); render(); });
    else if (act==="rename" && r) ask(`<label for="rn" style="display:block;margin-bottom:8px;color:var(--muted)">Recipe name</label><input class="field" id="rn" value="${esc(r.name)}">`, "Save", ()=>{ const v = document.getElementById("rn").value.trim(); if (v) { r.name = v; syncLib(r); buildPlan(); save(); render(); } });
    else if (act==="clearReady") { S.target = null; buildPlan(); save(); render(); }
    else if (act==="approve") { S.approved[t.dataset.key] = true; buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); }
    else if (act==="cook") { buildPlan(); S.view = "cook"; save(); render(); window.scrollTo(0,0); }
    else if (act==="setup") { S.view = "setup"; save(); render(); window.scrollTo(0,0); }
    else if (act==="start") { S.startAt = Date.now(); save(); go(S.idx); }
    else if (act==="now") {
      const a = anchor(); if (!a) return;
      const el = (Date.now() - a)/60000; let pick = 0;
      PLAN.blocks.forEach((b,i)=>{ if (el >= b.off) pick = i; });
      go(pick);
    }
    else if (act==="ready") ask(`<label for="rt" style="display:block;margin-bottom:8px;color:var(--muted)">Eat at</label><input class="field" type="datetime-local" id="rt" step="300" style="color-scheme:dark;font-size:18px" value="${S.target ? dtLocal(S.target) : ""}">`, "Set", ()=>{ setReady(document.getElementById("rt").value); });
    else if (act==="reset") ask("Clear every checkbox and stop the clock? Your recipes and ready time stay.", "Reset", ()=>{ S.done = {}; S.startAt = null; S.idx = 0; resetChecks = true; save(); render(); });
    return;
  }
  const tab = e.target.closest(".tl"); if (tab) go(+tab.dataset.i);
});
function setReady(v){
  if (!v) return;
  let t;
  if (v.includes("T")) t = new Date(v);
  else { const [h,m] = v.split(":").map(Number); t = new Date(); t.setHours(h,m,0,0); if (t.getTime() <= (S.startAt || Date.now())) t.setDate(t.getDate()+1); }
  if (isNaN(t)) return;
  const old = S.target, delta = old ? t.getTime() - old : 0;
  S.target = t.getTime(); S.approved = {}; buildPlan(); save(); render();
  const own = S.recipes.filter(r=>r.readyBy);
  if (delta && own.length) {
    const days = Math.round(delta/86400000), amt = Math.abs(days) >= 1 && Math.abs(delta - days*86400000) < 60000 ? Math.abs(days) + " day" + (Math.abs(days)===1?"":"s") : fmtDur(Math.abs(delta)/60000);
    ask(`Also move ${own.length===1 ? "the recipe with its own ready-by" : "the " + own.length + " recipes with their own ready-by"} ${delta > 0 ? "later" : "earlier"} by ${amt}?`, "Move them", ()=>{ own.forEach(r=>r.readyBy += delta); buildPlan(); save(); render(); });
  }
}
document.addEventListener("change", e=>{
  const el = e.target;
  if (el.matches("input[data-id]")) {
    if (el.checked) S.done[el.dataset.id] = true; else delete S.done[el.dataset.id];
    sendCheck(el.dataset.id, el.checked);
    save(); const y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if (el.matches("input[data-have]")) {
    if (el.checked) S.have[el.dataset.have] = true; else delete S.have[el.dataset.have];
    sendCheck("have:" + el.dataset.have, el.checked);
    save(); const y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if (el.dataset.qb != null && el.dataset.f) {
    const bk = (S.quiet.blocks || [])[+el.dataset.qb]; if (!bk) return;
    const f = el.dataset.f;
    if (f === "short") bk.short = +el.value; else if (f === "days") bk.days = el.value; else if (el.value) bk[f] = el.value;
    buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if (el.id === "mealFile") { const f = el.files && el.files[0]; if (f) f.text().then(restoreMeal, ()=>setMealMsg("Couldn't read that file.", true)); return; }
  if (el.id === "readyIn") { if (el.value) setReady(el.value); return; }
  if (el.dataset.rb) {
    const r = S.recipes.find(x=>x.id===el.dataset.rb); if (!r) return;
    const t = el.value ? new Date(el.value).getTime() : NaN;
    if (isNaN(t)) delete r.readyBy; else r.readyBy = t;
    S.rbOpen = null; buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if (el.id === "qOn" || el.id === "qFrom" || el.id === "qTo") {
    if (el.id === "qOn") S.quiet.on = el.checked; else if (el.value) S.quiet[el.id === "qFrom" ? "from" : "to"] = el.value;
    buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if (el.dataset.adv) {
    const [rid, i] = el.dataset.adv.split(":"); const r = S.recipes.find(x=>x.id===rid); if (!r) return;
    const p = advItems(r).find(x=>x.i===+i); if (!p) return;
    r.advOver = r.advOver || {};
    if (el.value==="" || +el.value===autoAdvMin(p)) delete r.advOver[i]; else r.advOver[i] = Math.max(0, Math.round(+el.value));
    syncLib(r); buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if (el.dataset.step) {
    const [rid, si] = el.dataset.step.split(":"); const r = S.recipes.find(x=>x.id===rid); if (!r) return;
    const auto = autoStepMin(r, +si);
    if (el.value==="" || +el.value===auto) delete r.over[si]; else r.over[si] = Math.max(0, Math.round(+el.value));
    syncLib(r); buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if (el.dataset.prep) {
    const r = S.recipes.find(x=>x.id===el.dataset.prep); if (!r) return;
    r.prepOver = (el.value==="" || +el.value===autoPrepMin(r)) ? null : Math.max(0, Math.round(+el.value));
    syncLib(r); buildPlan(); save(); const y = window.scrollY; render(); window.scrollTo(0,y);
  }
});
document.addEventListener("input", e=>{
  if (e.target.id !== "boxq") return;
  boxQuery = e.target.value; render();
  const f = document.getElementById("boxq"); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
});
document.getElementById("prev").onclick = ()=>go(S.idx-1);
document.getElementById("next").onclick = ()=>go(S.idx+1);

buildPlan();
render();
if (S.share) {
  lastShared = JSON.stringify(sharedData());
  /* The recipe builder changed the meal: send it, and clear the cook checkboxes everywhere. */
  try { if (sessionStorage.getItem("rgp-push")) { sessionStorage.removeItem("rgp-push"); lastShared = ""; resetChecks = true; queuePush(); } } catch(e) {}
  startPolling();
}
if (S.alerts && S.alerts.on && pushOK()) { navigator.serviceWorker.register("/sw.js").catch(()=>{}); queueAlerts(); }
if (new URLSearchParams(location.search).get("now")) { history.replaceState(null, "", location.pathname); jumpNow(); }
(function(){
  const id = new URLSearchParams(location.search).get("plan");
  if (!id) return;
  history.replaceState(null, "", location.pathname);
  if (S.share && S.share.id === id) return;
  if (S.recipes.length) ask("Open the shared plan? It replaces the meal on this phone. Your recipe box stays.", "Open it", ()=>joinShare(id));
  else joinShare(id);
})();
</script>
</body>
